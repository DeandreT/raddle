[workspace]
members = ["crates/raddle", "crates/raddle-postgres", "crates/raddle-axum", "crates/raddle-sqlite", "crates/raddle-rabbitmq", "crates/raddle-servicebus", "crates/raddle-testkit"]
resolver = "3"
exclude = ["conformance", "vendor/azservicebus", "fuzz"]

[patch.crates-io]
azservicebus = { path = "vendor/azservicebus" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/DeandreT/raddle"

[workspace.dependencies]
futures-util = { version = "0.3.31", default-features = false, features = ["alloc", "std"] }
thiserror = "2.0.17"
tokio = { version = "1.48", default-features = false, features = ["sync"] }
tracing = { version = "0.1.41", default-features = false, features = ["std"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "migrate", "macros"] }
raddle = { path = "crates/raddle", version = "0.1.0" }
azservicebus = { version = "0.25.1", path = "vendor/azservicebus", default-features = false, features = ["rustls"] }
azure_core = { version = "0.25", default-features = false }
url = "2.5"
raddle-testkit = { path = "crates/raddle-testkit", version = "0.1.0" }
raddle-postgres = { path = "crates/raddle-postgres", version = "0.1.0" }
axum = { version = "0.8", features = ["json"] }
schemars = { version = "1.0", features = ["uuid1"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
