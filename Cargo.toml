[workspace]
members = ["crates/raddle"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/DeandreT/raddle"

[workspace.dependencies]
futures-util = { version = "0.3.31", default-features = false, features = ["alloc", "std"] }
thiserror = "2.0.17"
tokio = { version = "1.48", default-features = false, features = ["sync"] }
tracing = { version = "0.1.41", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
