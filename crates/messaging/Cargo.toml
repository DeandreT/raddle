[package]
name = "raddle-messaging"
description = "Explicit application message bus, managed queues and transactional handler effects"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
default = []
crypto-ingress = ["dep:raddle-crypto"]
serialization-ingress = ["dep:raddle-serialization"]
serialization-rpc = ["dep:raddle-serialization", "dep:serde_json"]

[dependencies]
raddle-crypto = { path = "../crypto", version = "0.1.0", optional = true }
raddle-serialization = { path = "../serialization", version = "0.1.0", optional = true }
raddle.workspace = true
raddle-postgres.workspace = true
raddle-host.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }
futures-util.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }

[dev-dependencies]
raddle-tcp = { path = "../tcp", version = "0.1.0", features = ["serialization"] }
prost = "0.14.4"
rmp-serde = "1.3.1"
tokio-util = { version = "0.7", features = ["rt"] }
serde_json.workspace = true
sqlx.workspace = true
raddle-rabbitmq = { path = "../rabbitmq", version = "0.1.0" }
lapin = { version = "4.12.3", default-features = false, features = ["tokio", "rustls", "rustls--ring", "rustls-webpki-roots-certs"] }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util", "net", "io-util"] }

[lints]
workspace = true
