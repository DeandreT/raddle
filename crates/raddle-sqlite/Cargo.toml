[package]
name = "raddle-sqlite"
description = "Single-node transactional SQLite messaging for raddle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
raddle.workspace = true
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
chrono.workspace = true
uuid.workspace = true
sha2.workspace = true
thiserror.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
raddle-testkit.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile = "3"

[lints]
workspace = true
