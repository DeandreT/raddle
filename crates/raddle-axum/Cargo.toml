[package]
name = "raddle-axum"
description = "Authenticated Axum adapters with generated OpenAPI for raddle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
raddle.workspace = true
raddle-postgres.workspace = true
axum = { workspace = true, features = ["http2"] }
multer = "3.1"
matchit = "=0.8.4"
url.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
futures-util.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "net", "time", "process", "io-util"] }
tower.workspace = true
http-body-util.workspace = true
sqlx.workspace = true
jsonschema = { version = "0.33", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "http2", "multipart"] }

[lints]
workspace = true
